# Выкладка сайта на GitHub Pages. Запускается при каждом коммите в main.
# Перед выкладкой tools/bump.js считает хеш всех файлов и вписывает его в sw.js и в ?v= у css/js,
# поэтому после любой правки у посетителей автоматически подтягивается свежая версия сайта (старый кэш не остаётся).
# Нужна одна настройка: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка (css склеивается в один файл)
        run: node tools/build.js _site
      - name: Автоверсия (хеш в sw.js и ?v= в index.html)
        run: node tools/bump.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
