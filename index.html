<script>
/* Обновления сайта: проверка при открытии и при возвращении в приложение; тост «Обновить» после смены версии */
(function(){
if(!("serviceWorker" in navigator)||location.protocol==="file:")return;
var T={ru:["Доступно обновление","Обновить"],en:["Update available","Refresh"],hy:["Թարմացում կա","Թարմացնել"],de:["Update verfügbar","Neu laden"]};
var hadCtl=!!navigator.serviceWorker.controller,shown=0,reloading=0;
function toast(){
 if(shown)return;shown=1;
 var l=T[document.documentElement.lang]||T.en,d=document.createElement("div");
 d.id="upd-toast";d.setAttribute("role","status");
 d.innerHTML='<span></span><button type="button"></button>';
 d.firstChild.textContent=l[0];d.lastChild.textContent=l[1];
 d.lastChild.onclick=function(){if(reloading)return;reloading=1;location.reload()};
 document.body.appendChild(d);
}
navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtl)toast()});
addEventListener("load",function(){
 navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
  var last=0,chk=function(){var n=Date.now();if(n-last<30000)return;last=n;reg.update().catch(function(){})};
  chk();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)chk()});
  addEventListener("online",chk);
 }).catch(function(){});
});
})();
</script>
